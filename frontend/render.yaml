# Render Blueprint: frontend static site.
services:
  - type: web
    name: coffee-shop-front
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA fallback for react-router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_ORIGIN
        sync: false            # https://<backend>.onrender.com
      - key: VITE_API_BASE_URL
        sync: false            # https://<backend>.onrender.com/api
