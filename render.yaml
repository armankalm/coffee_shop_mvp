# Render Blueprint: one web service (Spring Boot API + bundled React app).
# Database and product images live in Supabase, so nothing expires after 30 days.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repository.

services:
  - type: web
    name: coffee-shop
    runtime: docker
    plan: free
    # Build context is the repo root: the Dockerfile copies both backend/ and frontend/.
    dockerfilePath: ./docker/prod.Dockerfile
    dockerContext: .
    healthCheckPath: /v3/api-docs
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # --- Database: Supabase -> Connect -> Session pooler ---
      # Not the direct connection: db.<ref>.supabase.co is IPv6-only and Render has no IPv6.
      - key: DB_HOST
        sync: false            # aws-0-<region>.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USERNAME
        sync: false            # postgres.<project-ref>
      - key: DB_PASSWORD
        sync: false
      # Test data. Once applied keep it here: Flyway validates the migration history.
      - key: FLYWAY_LOCATIONS
        value: classpath:db/migration,classpath:db/seed

      # --- Product images: Supabase -> Storage, public bucket ---
      - key: SUPABASE_URL
        sync: false            # https://<project-ref>.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false            # API Keys -> Legacy -> service_role
      - key: SUPABASE_STORAGE_BUCKET
        value: products

      - key: JWT_SECRET
        generateValue: true

      # FRONTEND_URL / CORS_ALLOWED_ORIGINS / BACKEND_URL are not needed: the frontend is
      # served by this same service and RENDER_EXTERNAL_URL is injected by Render.

      # --- Mail: Brevo HTTP API (SMTP ports 25/465/587 are blocked on Render free) ---
      # Empty key -> OTP dev-mode: the code is returned in the API response.
      # Never leave it empty on a public stand.
      - key: BREVO_API_KEY
        sync: false            # xkeysib-...
      - key: MAIL_FROM_ADDRESS
        sync: false            # must be a verified sender in Brevo
      - key: MAIL_FROM_NAME
        value: Coffee Shop

      # --- Google sign-in ---
      # Authorized redirect URI in Google Cloud Console:
      #   https://<service>.onrender.com/api/auth/oauth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
