spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coffeeshop_demo}
    username: ${DB_USERNAME:coffeeshop}
    password: ${DB_PASSWORD:coffeeshop}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    com.coffeeshop: INFO
    org.springframework.security: WARN
  file:
    name: logs/coffee-shop-demo.log
