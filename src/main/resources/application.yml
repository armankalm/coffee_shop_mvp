spring:
  application:
    name: coffee-shop-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coffeeshop_dev}
    username: ${DB_USERNAME:coffeeshop}
    password: ${DB_PASSWORD:coffeeshop}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    # WARNING: Default is for local dev only. Always set JWT_SECRET in any deployed environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-do-NOT-use-in-any-deployed-environment}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    length: 6
  payment:
    stripe:
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    kaspi:
      api-key: ${KASPI_API_KEY:}

print:
  printer:
    host: ${PRINTER_HOST:localhost}
    port: ${PRINTER_PORT:9100}
    enabled: ${PRINTER_ENABLED:false}
    timeout-ms: ${PRINTER_TIMEOUT_MS:5000}
  auto-print:
    enabled: ${AUTO_PRINT_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.coffeeshop: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  file:
    name: logs/coffee-shop-dev.log

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    length: 6
  payment:
    stripe:
      webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    kaspi:
      api-key: ${KASPI_API_KEY}

print:
  printer:
    host: ${PRINTER_HOST:localhost}
    port: ${PRINTER_PORT:9100}
    enabled: ${PRINTER_ENABLED:false}
    timeout-ms: ${PRINTER_TIMEOUT_MS:5000}
  auto-print:
    enabled: ${AUTO_PRINT_ENABLED:false}

logging:
  level:
    com.coffeeshop: INFO
    org.springframework.security: WARN
  file:
    name: logs/coffee-shop.log
