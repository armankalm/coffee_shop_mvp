spring:
  application:
    name: coffee-shop-system
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  # Public URLs. On Render RENDER_EXTERNAL_URL is injected automatically.
  backend-url: ${BACKEND_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    # Brevo HTTP API (SMTP is blocked on Render free). Empty key -> OTP dev-mode: code is returned in the response.
    brevo-api-key: ${BREVO_API_KEY:}
    # Must be a verified sender in Brevo.
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:Coffee Shop}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  storage:
    # Supabase Storage for product images. Empty url -> files are kept on local disk (app.upload.dir).
    supabase-url: ${SUPABASE_URL:}
    supabase-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:products}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coffeeshop_dev}
    username: ${DB_USERNAME:coffeeshop}
    password: ${DB_PASSWORD:coffeeshop}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # WARNING: Default is for local dev only. Always set JWT_SECRET in any deployed environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-do-NOT-use-in-any-deployed-environment}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  upload:
    dir: ${UPLOAD_DIR:./uploads/products}
  order:
    # Business timezone used to compute the per-shop daily order number reset (at local midnight).
    timezone: ${ORDER_TIMEZONE:Asia/Almaty}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    length: 6
  payment:
    stripe:
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    kaspi:
      api-key: ${KASPI_API_KEY:}

print:
  printer:
    host: ${PRINTER_HOST:localhost}
    port: ${PRINTER_PORT:9100}
    enabled: ${PRINTER_ENABLED:false}
    timeout-ms: ${PRINTER_TIMEOUT_MS:5000}
  auto-print:
    enabled: ${AUTO_PRINT_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.coffeeshop: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  file:
    name: logs/coffee-shop-dev.log

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Supabase: use the Session pooler (port 5432) — Render has no outbound IPv6, so the direct host won't resolve.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase free tier caps pooler connections, keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Add classpath:db/seed to load test data on a fresh DB.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

server:
  # Render injects PORT.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    length: 6
  payment:
    stripe:
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    kaspi:
      api-key: ${KASPI_API_KEY:}
  upload:
    dir: ${UPLOAD_DIR:./uploads/products}
  order:
    timezone: ${ORDER_TIMEZONE:Asia/Almaty}

print:
  printer:
    host: ${PRINTER_HOST:localhost}
    port: ${PRINTER_PORT:9100}
    enabled: ${PRINTER_ENABLED:false}
    timeout-ms: ${PRINTER_TIMEOUT_MS:5000}
  auto-print:
    enabled: ${AUTO_PRINT_ENABLED:false}

logging:
  level:
    com.coffeeshop: INFO
    org.springframework.security: WARN
  file:
    name: logs/coffee-shop.log
